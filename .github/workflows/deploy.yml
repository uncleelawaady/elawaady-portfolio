name: Deploy site

# Publishes the repo root to GitHub Pages on every push to main.
#
# `enablement: true` turns Pages on the first time this runs, so the site goes
# live without anyone opening Settings. That switches the Pages source to
# "GitHub Actions", which is the only mode the built-in GITHUB_TOKEN is allowed
# to configure — enabling the classic branch source needs a human or a PAT.
#
# One consequence: in this mode the CNAME file in the repo is not what binds the
# custom domain. elawaady.com still has to be entered once under
# Settings > Pages > Custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
