name: Fix proof query
on:
  push:
    paths:
      - '.github/workflows/fix-proof-query.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Firestore queries
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          old="""    listApproved: (max = 60) => run(async () =>
      rows(await F.getDocs(F.query(col(), F.where('status','==','approved'),
        F.orderBy('createdAt','desc'), F.limit(max))))),

    listMine: () => run(async () => {
      if (!user) return [];
      return rows(await F.getDocs(F.query(col(), F.where('uid','==',user.uid),
        F.orderBy('createdAt','desc'))));
    }),"""
          new="""    /* نتجنب composite index: نفلتر في Firestore ونرتب محليًا. */
    listApproved: (max = 60) => run(async () => {
      const out = rows(await F.getDocs(F.query(col(), F.where('status','==','approved'))));
      return out.sort((a,b) => {
        const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return (b.featured?1:0)-(a.featured?1:0) || tb-ta;
      }).slice(0,max);
    }),

    listMine: () => run(async () => {
      if (!user) return [];
      const out = rows(await F.getDocs(F.query(col(), F.where('uid','==',user.uid))));
      return out.sort((a,b) => {
        const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return tb-ta;
      });
    }),"""
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          # Never expose Firebase internals or index URLs to visitors.
          s=s.replace("catch (e){ error = e.message; }\n\n  const n = list.length;", "catch (e){ console.error(e); error = 'تعذّر تحميل الإثباتات مؤقتًا. جرّب تحديث الصفحة.'; }\n\n  const n = list.length;", 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Fix public proofs Firestore query" || exit 0
          git push