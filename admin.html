<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم اتنقلت — elawaady-db.com</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png" type="image/png">

<!-- التحويل الفوري. الـmeta refresh بيشتغل حتى لو الجافاسكريبت متقفلة. -->
<meta http-equiv="refresh" content="0; url=app.html#/admin">
<link rel="canonical" href="app.html#/admin">

<style>
  :root{ --bg:#071F29; --panel:#0C2C37; --line:#174553; --text:#EAF4F7; --muted:#9FBAC4; --cyan:#20D6E3; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    display:grid;place-items:center;padding:24px;line-height:1.9;
    font-family:'Tajawal',system-ui,sans-serif;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px;max-width:460px;text-align:center;
  }
  h1{font-size:1.25rem;margin-block-end:10px}
  p{color:var(--muted);font-size:.95rem}
  a.go{
    display:inline-block;margin-block-start:18px;padding:11px 22px;border-radius:12px;
    background:linear-gradient(135deg,#10B5BF,#20D6E3 60%,#5DE7F2);
    color:#04222A;font-weight:800;text-decoration:none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>اللوحة اتنقلت</h1>
    <p>
      بقى في لوحة تحكم واحدة بس لصاحب الموقع، جوّه التطبيق نفسه، ومحمية
      بصلاحيات Firebase مش بكلمة سر في المتصفح.
    </p>
    <a class="go" href="app.html#/admin">افتح لوحة التحكم</a>
  </div>

  <script>
    /* الـmeta refresh بيسيب الصفحة دي في تاريخ التصفح، فزرار الرجوع بيرجّعك
       ليها ويحوّلك تاني. replace بيشيلها من التاريخ خالص. */
    location.replace('app.html#/admin');
  </script>
</body>
</html>
